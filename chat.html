<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>hey</title>

<link rel="stylesheet" href="css/chat.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

    <div class="header-left">

        <div class="logo" id="logoBtn">
            hey.
        </div>

        <button class="new-chat" id="newChat">
            <span class="plus">+</span>
            <span class="text">new chat</span>
        </button>

    </div>

    <div class="header-right">

                    <div class="model-switch">
                    <button id="modelBtn">
                    groq 🔍
                    </button>
                    </div>

                    <button id="imageModeBtn" title="Generate Images">
                    🎨
                    </button>





        <a href="profile.html" class="profile-link">
            profile
        </a>

    </div>

    

</header>

<main>

<!-- Sidebar -->
<aside class="sidebar">

    <div class="sidebar-header">
        <h2>hey.</h2>
    </div>


    <div class="quick-actions-section">


        <h3>
            ⚡quick actions
        </h3>



        <div class="quick-actions">



            <button class="quick-action" data-action="code">

                💻

                <div>

                    <strong>code</strong>

                    <span>debug and build</span>

                </div>

            </button>




            <button class="quick-action" data-action="study">

                📚

                <div>

                    <strong>study</strong>

                    <span>learn anything</span>

                </div>

            </button>




            <button class="quick-action" data-action="brainstorm">

                🧠

                <div>

                    <strong>brainstorm</strong>

                    <span>ideas and creativity</span>

                </div>

            </button>




            <button class="quick-action" data-action="writing">

                ✍️

                <div>

                    <strong>writing</strong>

                    <span>improve your text</span>

                </div>

            </button>




            <button class="quick-action" data-action="image">

                📸

                <div>

                    <strong>analyze image</strong>

                    <span>understand pictures</span>

                </div>

            </button>



        </div>

        </div> <!-- closes quick-actions-section -->

<div class="recent-section">

    <div class="recent-header">

        <h3>Recent Chats</h3>

        <button id="clearChatsBtn" title="Clear chat history">
            🗑️
        </button>

    </div>

    <div id="chatList"></div>

</div>

<div class="sidebar-footer">

    made by methukaaa

</div>

</aside>


    <!-- Everything that slides -->
    <div class="chat-wrapper">

        <div id="messages">

            <div class="welcome">
                <h1 id="welcomeText"></h1>
            </div>

        </div>



        <form id="chatForm">


    <div id="imagePreviewContainer" class="attachment-preview">

        <img id="imagePreview">

        <div class="attachment-details">

            <div id="imageName" class="attachment-name"></div>

            <div id="imageSize" class="attachment-size"></div>

        </div>


        <button
            type="button"
            id="removeImage"
            class="attachment-remove">

            ✕

        </button>

    </div>



    <div class="input-row">


        <button type="button" id="uploadBtn" class="tool-btn">
            ⊕
        </button>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >


        <input
            id="messageInput"
            type="text"
            placeholder="what's on your mind?"
            autocomplete="off"
        >

                <button type="button" id="voiceBtn" class="tool-btn">
                🎤
                </button>


        <button type="submit" class="send-btn">

            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2">

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M5 12h14M13 5l7 7-7 7"/>

            </svg>

        </button>


    </div>


</form>

    </div> <!-- closes chat-wrapper -->

</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script type="module" src="js/chat.js"></script>
<script type="module" src="js/auth-check.js"></script>

</body>

</html>
