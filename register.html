<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>hey. | create account</title>

<link rel="stylesheet" href="css/auth.css">

</head>


<body>


<div class="auth-container">

    <h1>
         create an account
    </h1>


    <p>
        trust me you'll love it here
    </p>



    <form id="registerForm">

        <input
        type="text"
        id="fullName"
        placeholder="full name"
        required
>


        <input 
        id="username"
        type="text"
        placeholder="username"
        required>


        <input 
        id="email"
        type="email"
        placeholder="email"
        required>


        <input 
        id="password"
        type="password"
        placeholder="password"
        required>



        <button type="submit">
            create account
        </button>


    </form>



    <div class="switch">

        already have an account?

        <a href="login.html">
            login
        </a>

    </div>


</div>



<script type="module" src="js/auth.js"></script>


</body>

</html>
